name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22, 24]
        include:
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    name: Packed tarball works when installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Install it into a fresh project and use every entry point
        run: |
          mkdir ../smoke && cd ../smoke
          npm init -y > /dev/null
          npm install --save-dev "$GITHUB_WORKSPACE"/routelens-*.tgz
          # It is mounted, never run: there is no command to call.
          test ! -e node_modules/.bin/routelens
          node --input-type=module -e "
            import { scan } from 'routelens/scan';
            const result = scan({ root: '$GITHUB_WORKSPACE/test/fixtures/demo' });
            if (result.routes.length === 0 || result.mountedIn.length !== 1) process.exit(1);
            console.log(result.stats);
          "
          node --input-type=module -e "
            import { routelens } from 'routelens';
            if (typeof routelens !== 'function') process.exit(1);
          "
          node -e "if (typeof require('routelens').routelens !== 'function') process.exit(1)"
          # Installing must leave the project exactly as it was: no file, no script.
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain)"
          test "$(LC_ALL=C ls -A)" = "$(printf 'node_modules\npackage-lock.json\npackage.json')"
